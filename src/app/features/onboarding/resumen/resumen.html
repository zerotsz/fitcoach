<div class="ob-page">
  <a routerLink="/" class="logo"><span>FIT</span>COACH</a>

  <div class="ob-layout">
    <div class="ob-left">
      <div class="progress-row">
        <a class="back-btn" routerLink="/onboarding/entrenamiento" aria-label="Volver">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
        </a>
        <div class="progress-track">
          <span class="seg done"></span>
          <span class="seg done"></span>
          <span class="seg done"></span>
          <span class="seg active"></span>
        </div>
      </div>
      <p class="step-label">Paso 4 de 4</p>

      <div class="trophy-wrap">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/>
          <path d="M7 4H5a2 2 0 0 0 2 4M17 4h2a2 2 0 0 1-2 4"/>
        </svg>
      </div>

      <h1 class="title">¡Tu plan está listo!</h1>
      <p class="subtitle">
        Hemos diseñado un esquema óptimo basado en tu perfil.
      </p>
    </div>

    <div class="ob-right">
      <div class="summary-card">
        <p class="summary-title">Resumen del plan inicial</p>

        <div class="summary-row">
          <span class="s-label">Meta Principal</span>
          <span class="s-value">{{ goalLabel }}</span>
        </div>
        <div class="summary-row">
          <span class="s-label">Frecuencia de entreno</span>
          <span class="s-value">{{ frequencyLabel }}</span>
        </div>
        <div class="summary-row">
          <span class="s-label">Duración recomendada</span>
          <span class="s-value">{{ duration }}</span>
        </div>
      </div>

      <button type="button" class="btn-continue" (click)="start()">
        Comenzar ahora
      </button>
    </div>
  </div>
</div>
