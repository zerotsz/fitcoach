<div class="ob-page">
  <a routerLink="/" class="logo"><span>FIT</span>COACH</a>

  <div class="ob-layout">
    <!-- Izquierda -->
    <div class="ob-left">
      <div class="progress-row">
        <button type="button" class="back-btn" routerLink="/login" aria-label="Volver">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
        </button>
        <div class="progress-track">
          <span class="seg active"></span>
          <span class="seg"></span>
          <span class="seg"></span>
          <span class="seg"></span>
        </div>
      </div>
      <p class="step-label">Paso 1 de 4</p>
      <h1 class="title">Cuéntanos tu objetivo</h1>
      <p class="subtitle">La IA usará esto para armar tu plan inicial</p>
    </div>

    <!-- Derecha -->
    <div class="ob-right">
      <div class="options">
        @for (g of goals; track g.id) {
          <button
            type="button"
            class="option-card"
            [class.selected]="selected === g.id"
            (click)="select(g.id)"
          >
            <span class="opt-icon" [attr.data-icon]="g.icon">
              @switch (g.icon) {
                @case ('down') {
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                    <path d="M12 5v14M19 12l-7 7-7-7"/>
                  </svg>
                }
                @case ('up') {
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                    <path d="M12 19V5M5 12l7-7 7 7"/>
                  </svg>
                }
                @case ('balance') {
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                    <path d="M12 3v18M5 8h14M7 8l-3 8h6l-3-8M17 8l-3 8h6l-3-8"/>
                  </svg>
                }
                @case ('bolt') {
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                    <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
                  </svg>
                }
              }
            </span>
            <span class="opt-text">
              <span class="opt-title">{{ g.title }}</span>
              <span class="opt-sub">{{ g.subtitle }}</span>
            </span>
            <span class="radio" [class.on]="selected === g.id"></span>
          </button>
        }
      </div>

      <button
        type="button"
        class="btn-continue"
        [disabled]="!selected"
        (click)="continue()"
      >
        Continuar
      </button>
    </div>
  </div>
</div>
