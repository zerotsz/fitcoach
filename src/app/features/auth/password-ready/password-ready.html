<div class="fp-page">
  <div class="fp-bg" aria-hidden="true"></div>
  <div class="fp-overlay" aria-hidden="true"></div>

  <div class="fp-content">
    <div class="fp-card">
      <div class="icon-wrap success">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
          <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
      </div>

      <p class="card-label">CONTRASEÑA ACTUALIZADA</p>
      <h1 class="title">Tu contraseña está lista</h1>
      <p class="subtitle">
        Ya puedes iniciar sesión y continuar con tu plan.
      </p>

      <a [routerLink]="loginLink" class="btn-submit">
        {{ loginLabel }}
      </a>
    </div>
  </div>
</div>
