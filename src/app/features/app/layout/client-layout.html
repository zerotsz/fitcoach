<div class="shell">
  <aside class="sidebar">
    <a routerLink="/app" class="brand">FITCOACH</a>

    <nav class="nav">
      @for (item of nav; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.exact }"
          class="nav-item"
        >
          <span class="nav-icon" [attr.data-icon]="item.icon">
            @switch (item.icon) {
              @case ('home') {
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9.5z"/>
                </svg>
              }
              @case ('dumbbell') {
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M6 8v8M18 8v8M4 10v4M8 10v4M16 10v4M20 10v4M8 12h8"/>
                </svg>
              }
              @case ('apple') {
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M12 3c0 2 1.5 3 1.5 3M8 10c-2 2-2 7 4 10 6-3 6-8 4-10-1.5-1.5-4-2-4-2s-2.5.5-4 2z"/>
                </svg>
              }
              @case ('chart') {
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M4 19V5M4 19h16M8 17V10M12 17V7M16 17v-5"/>
                </svg>
              }
              @case ('user') {
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <circle cx="12" cy="8" r="4"/>
                  <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
                </svg>
              }
            }
          </span>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>
  </aside>

  <main class="main">
    <router-outlet />
  </main>
</div>
