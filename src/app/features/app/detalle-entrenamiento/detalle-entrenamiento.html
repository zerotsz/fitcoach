<div class="page">
  <a routerLink="/app/entrenamientos" class="back">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
    Detalle de entrenamiento
  </a>

  <h1 class="title">{{ title }}</h1>

  <div class="layout">
    <div class="left">
      <div class="hero-wrap">
        <img [src]="heroImage" [alt]="title" class="hero-img" />
      </div>
      <div class="stats">
        <div class="stat">
          <span class="stat-label">Duración</span>
          <span class="stat-val">{{ duration }}</span>
        </div>
        <div class="stat">
          <span class="stat-label">Ejercicios</span>
          <span class="stat-val">{{ exerciseCount }}</span>
        </div>
        <div class="stat">
          <span class="stat-label">Nivel</span>
          <span class="stat-val accent">{{ level }}</span>
        </div>
      </div>
    </div>

    <div class="right">
      <h2 class="list-title">Lista de ejercicios</h2>
      <ol class="ex-list">
        @for (e of exercises; track e.n; let i = $index) {
          <li class="ex-item" [style.animation-delay]="(0.12 + i * 0.07) + 's'">
            <span class="ex-num">{{ e.n }}</span>
            <img [src]="e.thumb" [alt]="e.name" class="ex-thumb" />
            <div class="ex-info">
              <p class="ex-name">{{ e.name }}</p>
              <p class="ex-detail">{{ e.detail }}</p>
            </div>
          </li>
        }
      </ol>
      <button type="button" class="btn-start" (click)="startWorkout()">
        Iniciar entrenamiento
      </button>
    </div>
  </div>
</div>
